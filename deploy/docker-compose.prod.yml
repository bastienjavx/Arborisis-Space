# Arborisis — stack de production « serveur dédié » (auto-hébergement).
#
# Cible : une seule machine (VPS / bare metal) exécutant l'intégralité du jeu.
# Railway reste supporté en parallèle via les fichiers railway*.toml à la racine.
#
# Usage (depuis la racine du dépôt) :
#   ./install.sh                                  # installation one-click
#   arborisis up | logs | status | update         # exploitation courante
#
# Usage manuel équivalent :
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Les variables proviennent de `deploy/.env` (généré par install.sh depuis
# `deploy/.env.dedicated.example`). Ce fichier n'est jamais commité.

name: arborisis

# ── Fragments réutilisables ───────────────────────────────────────────────────

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-api-build: &api-build
  context: ..
  dockerfile: docker/api.Dockerfile

# Environnement partagé par l'API et tous les workers : ils tournent le même code
# et doivent partager les mêmes secrets (JWT, TOTP) et les mêmes accès données.
x-api-env: &api-env
  NODE_ENV: production
  TZ: ${TZ:-UTC}
  # Pas de PgBouncer ici : Postgres est local, le pool Prisma suffit.
  DATABASE_URL: postgresql://${POSTGRES_USER:-arborisis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans deploy/.env}@postgres:5432/${POSTGRES_DB:-arborisis}?schema=public
  DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-arborisis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans deploy/.env}@postgres:5432/${POSTGRES_DB:-arborisis}?schema=public
  REDIS_URL: redis://default:${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans deploy/.env}@redis:6379
  PRISMA_CONNECTION_LIMIT: ${PRISMA_CONNECTION_LIMIT:-10}
  PRISMA_STATEMENT_TIMEOUT_MS: ${PRISMA_STATEMENT_TIMEOUT_MS:-30000}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET manquant dans deploy/.env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET manquant dans deploy/.env}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-1209600}
  TOTP_ENC_KEY: ${TOTP_ENC_KEY:-}
  WEB_ORIGIN: ${PUBLIC_URL:?PUBLIC_URL manquant dans deploy/.env}
  APP_URL: ${PUBLIC_URL}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  # Adresse réseau interne de CETTE instance API : l'univers par défaut est réaligné
  # dessus au démarrage pour que le proxy `/api` du web route correctement.
  API_INTERNAL_URL: http://api:4000
  # Le provisioning automatique d'univers est une fonctionnalité Railway (clonage de
  # service via l'API Railway). En auto-hébergement, la capacité se gère à la main :
  # voir docs/SELF_HOSTING.md § « Scaling and universes ».
  UNIVERSE_PROVISIONING_ENABLED: 'false'
  UNIVERSE_MAX_PLAYERS: ${UNIVERSE_MAX_PLAYERS:-500}
  MAILTRAP_HOST: ${SMTP_HOST:-sandbox.smtp.mailtrap.io}
  MAILTRAP_PORT: ${SMTP_PORT:-2525}
  MAILTRAP_USER: ${SMTP_USER:-}
  MAILTRAP_PASS: ${SMTP_PASS:-}
  MAILTRAP_FROM: ${SMTP_FROM:-noreply@arborisis.game}

services:
  # ── Données ────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arborisis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-arborisis}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Non exposé publiquement par défaut. Pour un accès administrateur local,
    # définir POSTGRES_BIND=127.0.0.1:5432 dans deploy/.env, jamais 0.0.0.0.
    ports:
      - '${POSTGRES_BIND:-127.0.0.1:5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arborisis} -d ${POSTGRES_DB:-arborisis}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans deploy/.env}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      # BullMQ ne tolère pas l'éviction de ses clés : on refuse les écritures plutôt
      # que de perdre des jobs planifiés.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ── Release phase (migrations + seed), une seule fois par déploiement ──────

  migrate:
    build: *api-build
    image: arborisis-api:local
    restart: 'no'
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
    # `prisma` (6.x) relit parfois /app/.env plutôt que process.env lors de la
    # validation WASM : on l'écrit avant d'appeler la CLI. Le seed est idempotent.
    command:
      - sh
      - -lc
      - >
        printf 'DATABASE_URL=%s\n' "$$DIRECT_DATABASE_URL" > /app/.env &&
        npx prisma migrate deploy &&
        npx prisma db seed

  # ── API HTTP + WebSocket ───────────────────────────────────────────────────

  api:
    build: *api-build
    image: arborisis-api:local
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      SERVICE_ROLE: api
      API_PORT: 4000
    expose:
      - '4000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ── Workers BullMQ (mêmes images, rôles distincts) ─────────────────────────

  worker-gameplay:
    build: *api-build
    image: arborisis-api:local
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      SERVICE_ROLE: worker
      WORKER_ROLE: gameplay
    command: ['node', 'apps/api/dist/worker.js']

  # Balayages de récupération globaux : garder UNE seule instance.
  worker-maintenance:
    build: *api-build
    image: arborisis-api:local
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      SERVICE_ROLE: worker
      WORKER_ROLE: maintenance
    command: ['node', 'apps/api/dist/worker.js']

  # Contrôleur de capacité d'univers. Sans API Railway il ne peut rien provisionner,
  # d'où le profil optionnel : `docker compose --profile provisioning up -d`.
  worker-provisioning:
    build: *api-build
    image: arborisis-api:local
    restart: unless-stopped
    logging: *logging
    profiles: ['provisioning']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      SERVICE_ROLE: worker
      WORKER_ROLE: provisioning
    command: ['node', 'apps/api/dist/worker.js']

  # ── Front Next.js ──────────────────────────────────────────────────────────

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        # Inlinés au build : rebuild nécessaire si le domaine public change
        # (`arborisis update` s'en charge).
        SITE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
    image: arborisis-web:local
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
      SITE_URL: ${PUBLIC_URL}
      UNIVERSE_COOKIE_SECRET: ${UNIVERSE_COOKIE_SECRET:?UNIVERSE_COOKIE_SECRET manquant dans deploy/.env}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Entrée publique : TLS automatique + routage ────────────────────────────

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - web
      - api
    environment:
      # `domaine.tld` → HTTPS automatique (Let's Encrypt) ; `:80` → HTTP simple.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - '${HTTP_BIND:-0.0.0.0}:80:80'
      - '${HTTPS_BIND:-0.0.0.0}:443:443'
      - '${HTTPS_BIND:-0.0.0.0}:443:443/udp'

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
